version: '3.8'

services:
  vogue-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vogue-soa-fashion-club
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - DATABASE_URL=file:./prisma/vogue_master.db
      - JWT_SECRET=vogue_super_secure_jwt_production_secret_2026_gdgoc
      - ADMIN_INITIAL_USERNAME=vogue_admin
      - ADMIN_INITIAL_EMAIL=vogue@soa.ac.in
      - ADMIN_INITIAL_PASSWORD=VogueSOA@2026!Master
    volumes:
      - vogue_db_data:/app/server/prisma
      - vogue_uploads_data:/app/server/uploads

volumes:
  vogue_db_data:
  vogue_uploads_data:
